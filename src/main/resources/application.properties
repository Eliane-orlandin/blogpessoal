spring.application.name=blogpessoal

# Cria o Banco de dados e as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update

# Configuração da Conexão com o Banco de dados MySQL
spring.datasource.url=jdbc:mysql://localhost/db_blogpessoal?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&useSSl=false
spring.datasource.username=root
spring.datasource.password=29@Mysql79
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Exibir no Console os Comandos SQL executados pelo Hibernate
spring.jpa.show-sql=true

# Desabilita o recurso Open Session In View
spring.jpa.open-in-view=true

# Especifica o Dialeto do MySQL que o Hibernate irá utilizar
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Configurações de Fuso Horário e Data
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo
